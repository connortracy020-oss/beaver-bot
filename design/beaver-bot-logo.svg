<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Beaver Bot logo</title>
  <rect width="512" height="512" rx="112" fill="#0E0E10"/>

  <!-- antenna -->
  <path d="M256 124V82" stroke="#FF7A1A" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="256" cy="66" r="19" fill="#FF7A1A"/>

  <!-- ears -->
  <circle cx="92" cy="172" r="32" fill="#FF7A1A"/>
  <circle cx="86" cy="166" r="16" fill="#B94E0C"/>
  <circle cx="420" cy="172" r="32" fill="#FF7A1A"/>
  <circle cx="426" cy="166" r="16" fill="#B94E0C"/>

  <!-- head -->
  <path d="M256 112C352 112 438 170 444 276C450 378 358 438 256 438C154 438 62 378 68 276C74 170 160 112 256 112Z" fill="#FF7A1A"/>

  <!-- eyes -->
  <circle cx="176" cy="240" r="24" fill="#0E0E10"/>
  <circle cx="184" cy="231" r="8" fill="#FFFFFF"/>
  <circle cx="336" cy="240" r="24" fill="#0E0E10"/>
  <circle cx="344" cy="231" r="8" fill="#FFFFFF"/>

  <!-- muzzle -->
  <ellipse cx="256" cy="326" rx="108" ry="74" fill="#FFB27A"/>

  <!-- teeth -->
  <path d="M224 335Q241 338 256 324Q271 338 288 335V382Q288 394 276 394H236Q224 394 224 382Z" fill="#FFFFFF" stroke="#0E0E10" stroke-width="9" stroke-linejoin="round"/>
  <path d="M256 330V394" stroke="#0E0E10" stroke-width="7" fill="none"/>

  <!-- mouth and nose -->
  <path d="M192 318Q226 348 256 324Q286 348 320 318" stroke="#0E0E10" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M256 296V324" stroke="#0E0E10" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M222 272Q256 256 290 272Q295 292 268 306Q256 312 244 306Q217 292 222 272Z" fill="#0E0E10"/>

  <!-- circuit -->
  <clipPath id="head">
    <path d="M256 112C352 112 438 170 444 276C450 378 358 438 256 438C154 438 62 378 68 276C74 170 160 112 256 112Z"/>
  </clipPath>
  <g clip-path="url(#head)" stroke="#0E0E10" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M452 256H412L394 238"/>
    <path d="M452 280H400"/>
    <path d="M452 304H412L394 322"/>
    <circle cx="387" cy="231" r="9" fill="#FF7A1A"/>
    <circle cx="391" cy="280" r="9" fill="#FF7A1A"/>
    <circle cx="387" cy="329" r="9" fill="#FF7A1A"/>
  </g>
</svg>
